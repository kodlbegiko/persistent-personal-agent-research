name: Hourly i18n parity fix

on:
  push:
    branches: [watch/v2-hourly-20260816-1225]
    paths:
      - '.github/workflows/hourly-i18n-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watch/v2-hourly-20260816-1225
      - name: Insert new timeline translations and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/i18n.jsx')
          text = p.read_text()
          anchor = "  'pare-v03-protected-recovery': {"
          if "'pda-candidate-v10-development-fail':" not in text:
              block = """  'pda-candidate-v10-development-fail': {\n    zh: { title: 'Candidate-v10 Development — FAIL', description: 'Candidate-v10 在 candidate freeze 前即失敗：V10-A/B/C 均未通過全部 preregistered architecture qualification gates。所有架構都未達 lexical novelty、contradiction detection 與 contradiction false-certainty 要求；V10-B 另未通過 supersession 與 counterfactual directional/ACT-disable。H1–H15 與 protected evaluation 均未執行。', dependsOn: ['Candidate-v9 terminal lineage preserved', 'Candidate-v10 preregistration'], note: 'CANDIDATE_V10 DEVELOPMENT FAIL — NO CANDIDATE QUALIFIED · PRE_FREEZE_ARCHITECTURE_QUALIFICATION · no candidate freeze · protected_executed=false', evidenceLabel: 'PDA Candidate-v10 terminal 0bed7520' },\n    en: { title: 'Candidate-v10 Development — FAIL', description: 'Candidate-v10 failed before candidate freeze because V10-A/B/C each missed one or more preregistered architecture-qualification gates. All architectures failed lexical novelty, contradiction detection, and contradiction false-certainty requirements; V10-B also failed supersession and counterfactual directional/ACT-disable checks. H1–H15 and protected evaluation were not executed.', dependsOn: ['Candidate-v9 terminal lineage preserved', 'Candidate-v10 preregistration'], note: 'CANDIDATE_V10 DEVELOPMENT FAIL — NO CANDIDATE QUALIFIED · PRE_FREEZE_ARCHITECTURE_QUALIFICATION · no candidate freeze · protected_executed=false', evidenceLabel: 'PDA Candidate-v10 terminal 0bed7520' },\n  },\n  'pda-v7r-independent-requalification-fail': {\n    zh: { title: 'Candidate-v7 Independent Requalification (V7R) — FAIL', description: 'Frozen V7A-01 完成 5/5 次獨立 preregistered qualification，共 1,750 筆 fresh protected examples；research integrity PASS、candidate 未變更、protected-example access NONE，但 fresh OOD macro-F1 0.615642、ACT recall 0.38、Lexical 0.082051、Scope 0.060109、counterfactual exact-pair 0.291429，未達多項事前門檻。這是有效 scientific FAIL，不是 infrastructure invalidity。', dependsOn: ['Frozen V7A-01 immutable candidate', 'Independent V7R preregistration'], note: 'V7R REQUALIFICATION FAIL — CANDIDATE_V7_QUALIFICATION_LINEAGE_TERMINATED · Fresh Confirmatory NOT_AUTHORIZED · Gate G NOT_EXECUTED', evidenceLabel: 'PDA V7R terminal a247c8b9' },\n    en: { title: 'Candidate-v7 Independent Requalification (V7R) — FAIL', description: 'Frozen V7A-01 completed 5/5 independently preregistered qualification runs over 1,750 fresh protected examples. Research integrity passed, the candidate was unchanged, and protected-example access was NONE, but fresh OOD macro-F1 0.615642, ACT recall 0.38, Lexical 0.082051, Scope 0.060109, and counterfactual exact-pair 0.291429 missed multiple preregistered thresholds. This is a valid scientific FAIL, not infrastructure invalidity.', dependsOn: ['Frozen V7A-01 immutable candidate', 'Independent V7R preregistration'], note: 'V7R REQUALIFICATION FAIL — CANDIDATE_V7_QUALIFICATION_LINEAGE_TERMINATED · Fresh Confirmatory NOT_AUTHORIZED · Gate G NOT_EXECUTED', evidenceLabel: 'PDA V7R terminal a247c8b9' },\n  },\n"""
              if anchor not in text:
                  raise SystemExit('translation anchor not found')
              text = text.replace(anchor, block + anchor, 1)
              p.write_text(text)
          Path('.github/workflows/hourly-i18n-fix.yml').unlink()
          PY
      - name: Commit parity fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/i18n.jsx .github/workflows/hourly-i18n-fix.yml
          git commit -m 'watch: add v10 and V7R bilingual timeline parity'
          git push origin HEAD:watch/v2-hourly-20260816-1225
