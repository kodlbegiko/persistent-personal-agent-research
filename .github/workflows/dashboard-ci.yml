name: Dashboard Control Plane CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/dashboard-v2-control-plane]
    paths:
      - 'src/**'
      - 'api/**'
      - 'dashboard/**'
      - 'governance/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - '.github/workflows/dashboard-ci.yml'

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run validate:data
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:a11y
      - run: npm run test:visual
      - name: Upload control-plane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-control-plane-evidence
          path: |
            dist
            dashboard/state/verified/current.json
            dashboard/state/history
            dashboard/state/diffs
            test-results
            playwright-report
            package-lock.json
          if-no-files-found: warn
          retention-days: 14
