name: Exact-Main Vercel Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-vercel-production.yml

permissions:
  contents: read

concurrency:
  group: dashboard-v2-exact-main-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_2UInD4pRnALRv9emtsvl4fr5
  VERCEL_PROJECT_ID: prj_pmEnHIAkJM4XNm9QLM9cwuWDVkAL
  VERCEL_PROJECT_NAME: jarvis-research-dashboard
  CANONICAL_DOMAIN: https://jarvis-research-dashboard.vercel.app

jobs:
  exact-main-production:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify production credential exists
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error title=Production deployment blocked::VERCEL_TOKEN repository secret is required. No deployment was attempted."
            exit 78
          fi

      - name: Verify token can access target Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          if [ "$STATUS" != "200" ]; then
            echo "::error title=Vercel project access denied::Token cannot access target project (HTTP $STATUS)."
            cat /tmp/vercel-project.json
            exit 79
          fi
          node - <<'NODE'
          const fs = require('fs');
          const project = JSON.parse(fs.readFileSync('/tmp/vercel-project.json', 'utf8'));
          if (project.id !== process.env.VERCEL_PROJECT_ID) {
            console.error('VERCEL_PROJECT_ID_MISMATCH', project.id, process.env.VERCEL_PROJECT_ID);
            process.exit(80);
          }
          if (project.accountId && project.accountId !== process.env.VERCEL_ORG_ID) {
            console.error('VERCEL_ORG_ID_MISMATCH', project.accountId, process.env.VERCEL_ORG_ID);
            process.exit(81);
          }
          console.log('VERCEL_PROJECT_ACCESS_VERIFIED', project.id, project.name);
          NODE

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full control-plane preflight
        run: |
          npm run validate:data
          npm run test:unit
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run test:a11y
          npm run test:visual

      - name: Verify compiled application snapshot identity before Production deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/dashboard-v2-final-acceptance
          python - <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path('dashboard/state/verified/current.json')
          d = json.loads(p.read_text())
          expected = os.environ['GITHUB_SHA']
          program = next((x for x in d.get('sourceRepositories', []) if x.get('role') == 'PROGRAM_CONTROL'), None)
          checks = {
              'sourceUmbrellaSHA': d.get('sourceUmbrellaSHA') == expected,
              'programSourceSHA': bool(program and program.get('sha') == expected),
              'registryVersion': bool(d.get('registryVersion')),
              'watchPolicyVersion': bool(d.get('watchPolicyVersion')),
              'watchPolicyHash': d.get('watchPolicyHash') == '2851bc01078f6e2e3883c4a2cdad6603809dc56c80d791f0b87cd9dc408ec0a4',
              'contentHash': bool(d.get('contentHash')),
          }
          if not all(checks.values()):
              print('SNAPSHOT_IDENTITY_FAIL', checks, file=sys.stderr)
              sys.exit(3)
          out = {k: d.get(k) for k in ['schemaVersion','snapshotId','auditId','verifiedAt','sourceUmbrellaSHA','registryVersion','watchPolicyVersion','watchPolicyHash','contentHash']}
          out['programSourceSHA'] = program.get('sha')
          pathlib.Path('artifacts/dashboard-v2-final-acceptance/snapshot-verification.json').write_text(json.dumps(out, indent=2) + '\n')
          pathlib.Path('artifacts/dashboard-v2-final-acceptance/final-main-sha.txt').write_text(expected + '\n')
          print('SNAPSHOT_IDENTITY_VERIFIED', out)
          PY

      - name: Create exact-main Vercel Production deployment through REST API
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          sha = os.environ['GITHUB_SHA']
          payload = {
              'name': os.environ['VERCEL_PROJECT_NAME'],
              'project': os.environ['VERCEL_PROJECT_NAME'],
              'target': 'production',
              'gitSource': {
                  'type': 'github',
                  'org': 'kodlbegiko',
                  'repo': 'persistent-personal-agent-research',
                  'ref': 'main',
                  'sha': sha,
              },
              'gitMetadata': {
                  'remoteUrl': 'https://github.com/kodlbegiko/persistent-personal-agent-research',
                  'commitRef': 'main',
                  'commitSha': sha,
                  'dirty': False,
                  'ci': True,
                  'ciType': 'github-actions',
                  'ciGitProviderUsername': 'kodlbegiko',
                  'ciGitRepoVisibility': 'public',
              },
              'meta': {
                  'githubCommitSha': sha,
                  'exactMain': 'true',
              },
              'projectSettings': {
                  'framework': 'vite',
                  'installCommand': 'npm ci --no-audit --no-fund',
                  'buildCommand': 'npm run build',
                  'outputDirectory': 'dist',
                  'nodeVersion': '24.x',
              },
          }
          pathlib.Path('/tmp/vercel-deploy-request.json').write_text(json.dumps(payload))
          PY
          STATUS="$(curl -sS -o /tmp/vercel-deploy-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/vercel-deploy-request.json \
            "https://api.vercel.com/v13/deployments?forceNew=1&skipAutoDetectionConfirmation=1&teamId=$VERCEL_ORG_ID")"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "::error title=Vercel REST Production deployment creation failed::HTTP $STATUS"
            cat /tmp/vercel-deploy-response.json
            exit 82
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('/tmp/vercel-deploy-response.json'))
          if not d.get('id') or not d.get('url'):
              raise SystemExit('Vercel response missing deployment id/url')
          print('deployment_id='+d['id'])
          print('deployment_url=https://'+d['url'])
          PY
          cp /tmp/vercel-deploy-response.json artifacts/dashboard-v2-final-acceptance/deployment-create-response.json

      - name: Wait for Production deployment to become READY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            curl -fsS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?withGitRepoInfo=true&teamId=$VERCEL_ORG_ID" \
              > /tmp/vercel-deployment.json
            STATE="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/vercel-deployment.json'))
          print(d.get('readyState') or d.get('state') or '')
          PY
            )"
            echo "Vercel Production deployment state: $STATE (attempt $attempt)"
            if [ "$STATE" = "READY" ]; then
              cp /tmp/vercel-deployment.json artifacts/dashboard-v2-final-acceptance/production-deployment.json
              exit 0
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ] || [ "$STATE" = "BLOCKED" ]; then
              cat /tmp/vercel-deployment.json
              exit 83
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for Vercel Production deployment"
          exit 84

      - name: Verify Vercel Production target and native git source bind exact main SHA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path('artifacts/dashboard-v2-final-acceptance/production-deployment.json')
          d = json.loads(p.read_text())
          expected = os.environ['GITHUB_SHA']
          meta = d.get('meta') or {}
          git_source = d.get('gitSource') or {}
          git_meta = d.get('gitMetadata') or {}
          candidates = {
              'target': d.get('target'),
              'gitSource.sha': git_source.get('sha'),
              'gitMetadata.commitSha': git_meta.get('commitSha'),
              'meta.githubCommitSha': meta.get('githubCommitSha'),
          }
          if d.get('target') != 'production':
              print('PRODUCTION_TARGET_FAIL', candidates, file=sys.stderr)
              sys.exit(2)
          if git_source.get('sha') != expected:
              print('EXACT_MAIN_NATIVE_GIT_SOURCE_FAIL', candidates, file=sys.stderr)
              sys.exit(2)
          if meta.get('githubCommitSha') != expected:
              print('EXACT_MAIN_ATTESTATION_FAIL', candidates, file=sys.stderr)
              sys.exit(2)
          out = {
              'expectedMainSHA': expected,
              'target': d.get('target'),
              'nativeGitSourceSHA': git_source.get('sha'),
              'metadataCommitSHA': git_meta.get('commitSha'),
              'attestedCommitSHA': meta.get('githubCommitSha'),
              'deploymentId': d.get('id'),
              'deploymentUrl': d.get('url'),
              'readyState': d.get('readyState') or d.get('state'),
          }
          pathlib.Path('artifacts/dashboard-v2-final-acceptance/production-source-identity.json').write_text(json.dumps(out, indent=2) + '\n')
          print('EXACT_MAIN_PRODUCTION_IDENTITY_VERIFIED', out)
          PY

      - name: Verify canonical Production domain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ['CANONICAL_DOMAIN'].rstrip('/') + '/'
          expected = os.environ['GITHUB_SHA']
          evidence = pathlib.Path('artifacts/dashboard-v2-final-acceptance/production-api-verification.json')

          def fetch(url):
              request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'dashboard-v2-acceptance/1.0'})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()
              except Exception as exc:
                  return 0, str(exc).encode()

          for attempt in range(1, 31):
              root_status, root_body = fetch(base + '?acceptance=' + str(attempt))
              if root_status != 200:
                  print(f'Canonical root HTTP {root_status} (attempt {attempt})')
                  time.sleep(5)
                  continue

              html = root_body.decode('utf-8', errors='replace')
              match = re.search(r'assets/index-[^"\']+\.js', html)
              if not match:
                  print(f'Canonical JS asset not found (attempt {attempt})')
                  time.sleep(5)
                  continue

              asset_url = urllib.parse.urljoin(base, match.group(0))
              asset_status, asset_body = fetch(asset_url + '?acceptance=' + str(attempt))
              if asset_status != 200:
                  print(f'Canonical JS HTTP {asset_status} (attempt {attempt})')
                  time.sleep(5)
                  continue

              if expected.encode() not in asset_body:
                  print(f'Canonical bundle is not exact main yet (attempt {attempt})')
                  time.sleep(5)
                  continue

              pulse_status, pulse_body = fetch(base + 'api/research-pulse?acceptance=' + str(attempt))
              if pulse_status != 200:
                  print(f'Research pulse HTTP {pulse_status} (attempt {attempt})')
                  print(pulse_body.decode('utf-8', errors='replace')[:1000])
                  time.sleep(5)
                  continue

              try:
                  pulse = json.loads(pulse_body)
              except json.JSONDecodeError:
                  print(f'Research pulse returned invalid JSON (attempt {attempt})')
                  time.sleep(5)
                  continue

              if pulse.get('status') != 'LIVE':
                  print(f"Research pulse status is {pulse.get('status')!r}, not LIVE (attempt {attempt})")
                  time.sleep(5)
                  continue

              result = {
                  'canonicalDomain': base.rstrip('/'),
                  'rootHttp': 200,
                  'bundleHttp': 200,
                  'researchPulseHttp': 200,
                  'researchPulseStatus': 'LIVE',
                  'sourceSHA': expected,
              }
              evidence.write_text(json.dumps(result, indent=2) + '\n')
              print('CANONICAL_PRODUCTION_VERIFIED', expected)
              sys.exit(0)

          print('Canonical Production did not converge to exact main with healthy /api/research-pulse', file=sys.stderr)
          sys.exit(86)
          PY

      - name: Upload final production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-v2-final-production-acceptance
          path: artifacts/dashboard-v2-final-acceptance
          if-no-files-found: warn
          retention-days: 30
