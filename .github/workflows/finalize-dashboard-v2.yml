name: Finalize Dashboard v2

on:
  push:
    branches: [agent/dashboard-v2-control-plane]
    paths:
      - '.github/workflows/finalize-dashboard-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dashboard-v2-control-plane
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply final source patch
        run: |
          python3 scripts/finalize_dashboard_v2.py
          python3 scripts/finalize_dashboard_v2_parity.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate final data model and parity
        run: npm run validate:data
      - name: Unit tests
        run: npm run test:unit
      - name: Build and budgets
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full E2E
        run: npm run test:e2e
      - name: Accessibility
        run: npm run test:a11y
      - name: Visual regression
        run: npm run test:visual
      - name: Commit final source changes
        run: |
          rm -rf dist playwright-report test-results
          rm -f public/live-events.json
          git checkout HEAD -- .github/workflows/finalize-dashboard-v2.yml scripts/finalize_dashboard_v2.py scripts/finalize_dashboard_v2_parity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts tests dashboard/state/verified dashboard/state/history dashboard/state/diffs package-lock.json
          git commit -m "Finalize Dashboard v2 parity and critical-path DAG"
          git push origin HEAD:agent/dashboard-v2-control-plane
